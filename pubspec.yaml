name: fsa_app
description: Food Safety Agency inspector application.
publish_to: "none"
version: 1.0.1+2176

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.5
  crypto: ^3.0.5
  device_info_plus: ^10.1.2
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  http: ^1.2.2
  package_info_plus: ^8.0.2
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  geolocator: ^14.0.2
  uuid: ^4.6.0
  camera: ^0.12.0+2
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^12.0.2
  file_saver: ^0.4.0
  image: ^4.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  fake_async: ^1.3.3

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_source.png"
  # Adaptive icon for Android 8+: white plate behind the transparent mark, so
  # the red/teal logo keeps contrast whatever the launcher mask or wallpaper.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # iOS icons may not carry an alpha channel.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Egg inspection rules, so a freshly installed handset can capture an
    # inspection before it has ever seen the server. Regenerate with the
    # backend's `export_egg_reference` command.
    - assets/reference/
  fonts:
    # Poppins is the app's typeface. Bundled rather than fetched at runtime —
    # inspectors work offline.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    # Lato stays for the printed forms: the FSA's documents are set in it, and
    # a form is not the place to change typeface.
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
